---
name: golang-releases
"on":
  push:
  # dispatched by release.yml on an auto-released tag
  workflow_dispatch:
permissions:
  contents: write
  packages: read
jobs:
  mcvs-golang-action:
    strategy:
      matrix:
        args:
          - release-application-name: graphql-linter
            release-architecture: amd64
            release-dir: cmd/graphql-linter
            release-os: linux
            release-type: binary
          - release-application-name: graphql-linter
            release-architecture: arm64
            release-dir: cmd/graphql-linter
            release-os: linux
            release-type: binary
          - release-application-name: graphql-linter
            release-architecture: arm64
            release-dir: cmd/graphql-linter
            release-os: darwin
            release-type: binary
    runs-on: ubuntu-slim
    env:
      TASK_X_REMOTE_TASKFILES: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # yamllint disable-line rule:line-length
      - uses: schubergphilis/mcvs-golang-action@00ab2d14c61f68fd0187112817822c3734707348 # v3.13.1
        with:
          release-application-name: ${{ matrix.args.release-application-name }}
          release-architecture: ${{ matrix.args.release-architecture }}
          release-build-tags: ${{ matrix.args.release-build-tags }}
          release-dir: ${{ matrix.args.release-dir }}
          release-os: ${{ matrix.args.release-os }}
          release-type: ${{ matrix.args.release-type }}
          token: ${{ secrets.GITHUB_TOKEN }}
  # mcvs-golang-action uploads one binary per matrix job and no checksums, so
  # sum all binaries of the release once they are uploaded.
  checksums:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: mcvs-golang-action
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: upload graphql-linter_SHA256SUMS
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          cd "${dir}"
          gh release download "${TAG}" --pattern "graphql-linter-${TAG}-*"
          sha256sum "graphql-linter-${TAG}-"* >graphql-linter_SHA256SUMS
          cat graphql-linter_SHA256SUMS
          gh release upload "${TAG}" graphql-linter_SHA256SUMS --clobber
