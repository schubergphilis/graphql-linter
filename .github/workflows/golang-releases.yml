---
name: golang-releases
"on":
  push:
  # dispatched by release.yml on an auto-released tag
  workflow_dispatch:
permissions:
  contents: write
  packages: read
jobs:
  mcvs-golang-action:
    strategy:
      matrix:
        args:
          - release-application-name: graphql-linter
            release-architecture: amd64
            release-dir: cmd/graphql-linter
            release-os: linux
            release-type: binary
          - release-application-name: graphql-linter
            release-architecture: arm64
            release-dir: cmd/graphql-linter
            release-os: linux
            release-type: binary
          - release-application-name: graphql-linter
            release-architecture: arm64
            release-dir: cmd/graphql-linter
            release-os: darwin
            release-type: binary
    runs-on: ubuntu-slim
    env:
      TASK_X_REMOTE_TASKFILES: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # yamllint disable-line rule:line-length
      - uses: schubergphilis/mcvs-golang-action@b4889d53cfc1728ebcb8a551173456e76a2451f6 # v3.12.14
        with:
          release-application-name: ${{ matrix.args.release-application-name }}
          release-architecture: ${{ matrix.args.release-architecture }}
          release-build-tags: ${{ matrix.args.release-build-tags }}
          release-dir: ${{ matrix.args.release-dir }}
          release-os: ${{ matrix.args.release-os }}
          release-type: ${{ matrix.args.release-type }}
          token: ${{ secrets.GITHUB_TOKEN }}
