---
name: golang-releases
"on": push
permissions:
  contents: write
  packages: read
jobs:
  mcvs-golang-action:
    strategy:
      matrix:
        args:
          - release-application-name: graphql-linter
            release-architecture: amd64
            release-dir: cmd/graphql-linter
            release-os: linux
            release-type: binary
          - release-application-name: graphql-linter
            release-architecture: arm64
            release-dir: cmd/graphql-linter
            release-os: linux
            release-type: binary
          - release-application-name: graphql-linter
            release-architecture: arm64
            release-dir: cmd/graphql-linter
            release-os: darwin
            release-type: binary
    runs-on: ubuntu-slim
    env:
      TASK_X_REMOTE_TASKFILES: 1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      # yamllint disable-line rule:line-length
      - uses: schubergphilis/mcvs-golang-action@ae2f6b574119123e8ee0f457a1aace702947931b
        with:
          release-application-name: ${{ matrix.args.release-application-name }}
          release-architecture: ${{ matrix.args.release-architecture }}
          release-build-tags: ${{ matrix.args.release-build-tags }}
          release-dir: ${{ matrix.args.release-dir }}
          release-os: ${{ matrix.args.release-os }}
          release-type: ${{ matrix.args.release-type }}
          token: ${{ secrets.GITHUB_TOKEN }}
