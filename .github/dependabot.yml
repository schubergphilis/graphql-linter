---
version: 2
updates:
  - package-ecosystem: github-actions
    commit-message:
      prefix: build(deps)
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions-all:
        patterns:
          - "*"
  - package-ecosystem: gomod
    commit-message:
      prefix: build(deps)
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      gomod-all:
        patterns:
          - "*"
